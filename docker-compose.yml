services:
  wallet-bot:
    build: .
    image: wallet-bot:latest
    container_name: wallet-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    # Bot łączy się na zewnątrz (Telegram, Wallet API, Anthropic API, NBP) — bez otwartych portów.
    # Strona prognozy (port 8080 w kontenerze) jest dostępna tylko w sieci Nginx Proxy Managera:
    # w NPM dodaj Proxy Host → wallet-bot:8080 z listą dostępu (np. internal-panels).
    expose:
      - "8080"
    networks:
      - default
      - npm
    volumes:
      # Płatności cykliczne i założenia prognozy (katalog — kontener widzi zmiany po git pull).
      - ./config:/app/config:ro
      # Stan: co zapłacone / pominięte / przypomniane, długi. Przetrwa restart i przebudowę.
      - wallet-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Model mowy (faster-whisper small, int8) potrzebuje ~1 GB przy transkrypcji.
    mem_limit: 1536m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  npm:
    name: nginx_proxy_manager_network
    external: true

volumes:
  wallet-data:
