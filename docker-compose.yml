services:
  wallet-bot:
    build: .
    image: wallet-bot:latest
    container_name: wallet-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    # Bot łączy się tylko na zewnątrz (Telegram long polling, Discord gateway,
    # Wallet API, Anthropic API) — nie potrzebuje żadnych otwartych portów.
    volumes:
      # Płatności cykliczne (katalog, nie pojedynczy plik — wtedy kontener widzi zmiany po git pull).
      - ./config:/app/config:ro
      # Stan: co zapłacone / pominięte / przypomniane. Przetrwa restart i przebudowę.
      - wallet-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  wallet-data:
