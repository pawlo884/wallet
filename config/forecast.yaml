# Założenia prognozy (/prognoza w bocie i strona WWW). Zmień, zrób push — przelicza się samo.
# Płatności cykliczne, raty i długi bot bierze z config/schedule.yaml i /dlugi — tu tylko to, czego nie zna.

months: 12

# Wydatki spoza planu („na życie”): zakupy poza limitem, paliwo, dzieci, prezenty…
# Bazowy wariant jest głównym; pozostałe pokazują widełki.
living:
  oszczędny: 900
  bazowy: 1400
  luźny: 2000

# Opłacalność karty Multisport (aktywności ze Stravy — połącz przez /strava w bocie).
multisport:
  payment: multisport       # id płatności w config/schedule.yaml (z niej koszt miesięczny)
  ticket: 25                # ile kosztowałoby jedno wejście bez karty
  months: 6                 # ile miesięcy wstecz analizować
  # Typy aktywności Stravy liczone jako wejście na kartę (pływanie z GPS = otwarta woda, pomijane).
  sport_types: [WeightTraining, Workout, Crossfit, HighIntensityIntervalTraining, Swim, Yoga, Pilates, RockClimbing, Squash, Badminton]

# Konta oszczędnościowe (nazwy jak w Wallet). target: cel w zł; monthly: stała wpłata miesięcznie
# (0 = wpłaty tylko z dodatkowych dochodów); from: od którego miesiąca wpłacać (RRRR-MM, opcjonalnie).
# Wpłaty to przelewy z konta Ogólne (w bocie: „300 na awaryjne”) — nie są wydatkiem, ale zmniejszają wolne środki.
savings:
  - account: Awaryjne
    target: 3000          # na pilne, niespodziewane wydatki (awaria auta, lekarz)
    monthly: 0            # z dodatkowych dochodów
  - account: Poduszka finansowa
    target: 11600         # ≈ 3 miesiące kosztów stałych
    monthly: 0            # z dodatkowych dochodów
