# Płatności cykliczne obsługiwane przez bota (przeniesione z transakcji zaplanowanych Wallet 04.10.2026).
# W dniu terminu bot wysyła przypomnienie: ✅ zapłacone / ✏️ inna kwota / ⏭ pomiń.
# Po zmianach w tym pliku: /odswiez w bocie (bez restartu).
#
# Pola: id (a-z0-9_-, unikalne, NIE zmieniaj po starcie — po nim bot pamięta, co zapłacone),
#       name, amount, type (expense|income), category_id, rrule (format iCal RRULE),
#       from (data pierwszego terminu), opcjonalnie counterparty, account (nazwa lub ID konta).

